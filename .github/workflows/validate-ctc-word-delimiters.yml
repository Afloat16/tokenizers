name: Validate CTC word delimiters
on:
  push:
    branches: [validation/ctc-word-delimiters-20261112]
permissions:
  contents: read
jobs:
  native-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: tokenizers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 01e9c587e2acf292d5b5895d70ae8fa6a64deae2
          fetch-depth: 3
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: tokenizers
          shared-key: data-contributions-native
          cache-bin: false
      - name: Test patched tokenizer JSON decoding
        run: cargo test -p tk-serialize --features wordlevel --test ctc_cleanup -- --nocapture 2>&1 | tee patched.log
      - name: Test existing CTC decoder cases
        run: cargo test -p tk-encode --lib decoders::ctc::tests -- --nocapture 2>&1 | tee existing.log
      - name: Restore unchanged upstream decoder
        run: git checkout 39e28180be35af322d0abf08007d937641a5493b -- tk-encode/src/decoders/ctc.rs
      - name: Verify original behavior fails the three boundary regressions
        shell: bash
        run: |
          set +e
          cargo test -p tk-serialize --features wordlevel --test ctc_cleanup -- --nocapture > baseline.log 2>&1
          result=$?
          set -e
          cat baseline.log
          test "$result" -eq 101
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("baseline.log").read_text()
          assert re.search(r"test result: FAILED\. 1 passed; 3 failed; 0 ignored", text), text
          PY
      - name: Restore and lint the exact patch
        run: |
          git checkout 01e9c587e2acf292d5b5895d70ae8fa6a64deae2 -- tk-encode/src/decoders/ctc.rs
          rustfmt --edition 2024 --check tk-encode/src/decoders/ctc.rs tk-serialize/tests/ctc_cleanup.rs
          cargo clippy -p tk-serialize --features wordlevel --test ctc_cleanup -- -D warnings
      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ctc-native-validation
          path: |
            tokenizers/patched.log
            tokenizers/existing.log
            tokenizers/baseline.log
