name: Validate Unigram sampling JSON round trips
on:
  push:
    branches: [validation/unigram-sampling-json-20261112]
permissions:
  contents: read
jobs:
  native-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: tokenizers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8f2deb6d8295e1c0faa2410f210ffc9eae0c1087
          fetch-depth: 3
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: tokenizers
          shared-key: data-contributions-native
          cache-bin: false
      - name: Test native sampling JSON regressions
        run: set -o pipefail; cargo test -p tk-serialize --features unigram,serialize --test unigram_sampling_json -- --nocapture 2>&1 | tee patched.log
      - name: Test existing JSON serialization cases
        run: set -o pipefail; cargo test -p tk-serialize --features unigram,serialize --lib -- --nocapture 2>&1 | tee existing.log
      - name: Restore unchanged upstream reader and writer
        run: git checkout 39e28180be35af322d0abf08007d937641a5493b -- tk-serialize/src/from_json/model.rs tk-serialize/src/to_json/model.rs tk-serialize/src/to_json/writer.rs
      - name: Verify original behavior fails sampling JSON regressions
        shell: bash
        run: |
          set +e
          cargo test -p tk-serialize --features unigram,serialize --test unigram_sampling_json -- --nocapture > baseline.log 2>&1
          result=$?
          set -e
          cat baseline.log
          test "$result" -eq 101
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("baseline.log").read_text()
          assert re.search(r"test result: FAILED\. \d+ passed; [1-9]\d* failed;", text), text
          PY
      - name: Restore and lint the exact patch
        run: |
          git checkout 8f2deb6d8295e1c0faa2410f210ffc9eae0c1087 -- tk-serialize/src/from_json/model.rs tk-serialize/src/to_json/model.rs tk-serialize/src/to_json/writer.rs
          rustfmt --edition 2024 --config skip_children=true --check tk-serialize/src/from_json/model.rs tk-serialize/src/to_json/model.rs tk-serialize/src/to_json/writer.rs tk-serialize/tests/unigram_sampling_json.rs
          set +e
          cargo clippy -p tk-serialize --features unigram,serialize --test unigram_sampling_json -- -D warnings > clippy-patched.log 2>&1
          patched_status=$?
          git checkout 39e28180be35af322d0abf08007d937641a5493b -- tk-serialize/src/from_json/model.rs tk-serialize/src/to_json/model.rs tk-serialize/src/to_json/writer.rs
          cargo clippy -p tk-serialize --features unigram,serialize --test unigram_sampling_json -- -D warnings > clippy-baseline.log 2>&1
          baseline_status=$?
          set -e
          cat clippy-patched.log
          cat clippy-baseline.log
          test "$patched_status" -eq "$baseline_status"
          python3 - <<'PY'
          import re
          from pathlib import Path
          def errors(name):
              text = re.sub(r"\x1b\[[0-9;]*m", "", Path(name).read_text())
              return [line for line in text.splitlines() if line.startswith("error:")]
          expected = [
              "error: the loop variable `lane` is used to index `slot.payload`",
              "error: the loop variable `pos` is only used to index `self.begin_nodes`",
              "error: could not compile `tk-encode` (lib) due to 2 previous errors",
          ]
          assert errors("clippy-baseline.log") == expected, errors("clippy-baseline.log")
          assert errors("clippy-patched.log") == expected, errors("clippy-patched.log")
          PY
          git checkout 8f2deb6d8295e1c0faa2410f210ffc9eae0c1087 -- tk-serialize/src/from_json/model.rs tk-serialize/src/to_json/model.rs tk-serialize/src/to_json/writer.rs
      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unigram-sampling-json-native-validation
          path: |
            tokenizers/patched.log
            tokenizers/existing.log
            tokenizers/baseline.log
            tokenizers/clippy-patched.log
            tokenizers/clippy-baseline.log
